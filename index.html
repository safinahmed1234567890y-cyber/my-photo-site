<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TORiK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{min-height:100vh;background:#050a1a;display:flex;justify-content:center;align-items:center;padding:20px}
.card{width:100%;max-width:360px;background:#0f1733;border:1px solid #2a6aff;border-radius:28px;padding:35px 25px;text-align:center;box-shadow:0 0 30px rgba(42,106,255,0.4)}
.avatar{width:150px;height:150px;margin:0 auto 20px;border-radius:50%;border:3px solid #2a6aff;box-shadow:0 0 20px #2a6aff;object-fit:cover;display:block}
h1{color:white;font-size:36px;letter-spacing:4px;text-shadow:0 0 15px #2a6aff}
h1 span{color:#2a6aff}
.sub{color:#7a9cd6;letter-spacing:4px;font-size:12px;margin:10px 0 20px}
.line{height:1px;background:linear-gradient(90deg,transparent,#2a6aff,transparent);margin:20px 0}
.advice{background:rgba(42,106,255,0.12);border-left:3px solid #2a6aff;padding:12px;border-radius:0 10px 10px 0;text-align:left}
.advice small{color:#2a6aff;font-size:11px}
.advice p{color:#c0d0f0;font-size:13px;margin-top:5px;line-height:1.5}
.btn{display:block;margin-top:20px;background:#1877f2;color:white;text-decoration:none;padding:14px;border-radius:12px;font-weight:bold}
.palestine{margin-top:15px;background:#0a1020;border:1px solid #2a6aff;border-radius:10px;padding:10px;display:flex;align-items:center;gap:10px}
.palestine img{width:45px;border-radius:6px}
.palestine span{color:#7ed6a0;font-size:13px;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<img class="avatar" src="torik.jpg" alt="TORiK">
<h1>TORiK</h1>
<div class="sub">CYBER • PRIVACY • JUSTICE</div>
<div class="line"></div>
<div class="advice"><small>উপদেশ</small><p>জ্ঞান দিয়ে রক্ষা করো, ধ্বংস নয়। সত্যের পক্ষে থাকো।</p></div>
<div class="palestine"><img src="https://upload.wikimedia.org/wikipedia/commons/f/f4/Palestine_Flag.png"><span>#StandWithPalestine</span></div>
<a class="btn" href="https://www.facebook.com/profile.php?id=61591022747655" target="_blank">Follow on Facebook</a>
</div>
</body>
</html>
