<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TORiK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{min-height:100vh;background:#050a1a;display:flex;justify-content:center;align-items:center;padding:20px}
.card{width:100%;max-width:350px;background:#0f1733;border:1px solid #2a6aff;border-radius:28px;padding:30px 25px;text-align:center;box-shadow:0 0 25px rgba(42,106,255,0.4)}
.avatar{width:160px;height:160px;margin:0 auto 18px;border-radius:50%;border:3px solid #2a6aff;box-shadow:0 0 20px #2a6aff;object-fit:cover;display:block}
h1{color:white;font-size:38px;letter-spacing:3px;text-shadow:0 0 12px #2a6aff}
.sub{color:#7aa0d6;font-size:11px;letter-spacing:3px;margin:6px 0 18px}
.line{height:1px;background:linear-gradient(90deg,transparent,#2a6aff,transparent);margin:15px 0}
.box{background:rgba(42,106,255,0.1);border-left:3px solid #2a6aff;padding:12px;text-align:left;border-radius:0 10px 10px 0}
.box small{color:#2a6aff}
.box p{color:#c0d0f0;font-size:14px;margin-top:4px}
.btn{display:block;margin-top:16px;background:#1877f2;color:white;text-decoration:none;padding:13px;border-radius:11px;font-weight:bold}
.pal{margin-top:12px;color:#4ade80;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<img class="avatar" src="torik.jpg">
<h1>TORiK</h1>
<div class="sub">CYBER • PRIVACY • JUSTICE</div>
<div class="line"></div>
<div class="box"><small>উপদেশ</small><p>জ্ঞান দিয়ে রক্ষা করো, ধ্বংস নয়। সত্যের পক্ষে থাকো।</p></div>
<div class="pal">🇵🇸 #StandWithPalestine</div>
<a class="btn" href="https://www.facebook.com/profile.php?id=61591022747655" target="_blank">Follow on Facebook</a>
</div>
</body>
</html>
